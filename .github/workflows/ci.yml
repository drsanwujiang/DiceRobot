name: CI

on:
  push:
    branches: [main, dev]
    tags: ["*"]
  pull_request:

# 本工作流只读取仓库内容，不签出以外的权限一律不给。
permissions:
  contents: read

# 同一分支或 PR 连续推送时取消尚未完成的运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3.0"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: poetry

      - name: Install dependencies
        run: poetry install

      - name: Ruff
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Mypy
        run: poetry run mypy

      - name: Pytest
        run: poetry run pytest

      - name: Alembic
        run: |
          poetry run alembic upgrade head
          poetry run alembic check

  image:
    name: Image build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: dicerobot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --detach --name dicerobot-ci \
            --env QQ__APP_ID=000000 \
            --env QQ__SECRET=ci-placeholder-secret \
            --publish 8080:8080 \
            dicerobot:ci

          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi

            # 容器已退出时不必等满超时，日志里就有原因。
            if [ "$(docker inspect --format '{{.State.Running}}' dicerobot-ci)" != "true" ]; then
              break
            fi

            sleep 1
          done

          echo "Smoke test failed"
          docker logs dicerobot-ci
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm --force dicerobot-ci || true

  publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check, image]
    # 只有 main 的推送与版本标签才发布：dev 与 PR 构建同样的镜像，但不对外推送。
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: drsanwujiang/dicerobot
          # main 的推送发布 main 标签；5.0.0 这样的版本标签发布 5.0.0、5.0、5，
          # 并按 latest=auto 的默认行为把 latest 指向最新的正式版本。
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 各层已由 image job 构建并写入缓存，此处命中后只剩推送。
          cache-from: type=gha

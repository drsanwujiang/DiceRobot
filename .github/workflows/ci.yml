name: CI

on:
  push:
    branches: [main, dev]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3.0"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: poetry

      - name: Install dependencies
        run: poetry install

      - name: Ruff
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Mypy
        run: poetry run mypy

      - name: Pytest
        run: poetry run pytest

      - name: Alembic
        run: |
          poetry run alembic upgrade head
          poetry run alembic check

  image:
    name: Image build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: dicerobot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --detach --name dicerobot-ci \
            --env QQ__APP_ID=000000 \
            --env QQ__SECRET=ci-placeholder-secret \
            --publish 8080:8080 \
            dicerobot:ci

          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi

            if [ "$(docker inspect --format '{{.State.Running}}' dicerobot-ci)" != "true" ]; then
              break
            fi

            sleep 1
          done

          echo "Smoke test failed"
          docker logs dicerobot-ci
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm --force dicerobot-ci || true

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check, image]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            drsanwujiang/dicerobot
            ${{ vars.ALIYUN_REGISTRY }}/drsanwujiang/dicerobot
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ALIYUN_REGISTRY }}
          username: ${{ vars.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha

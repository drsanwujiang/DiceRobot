name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# 本工作流只读取仓库内容，不签出以外的权限一律不给。
permissions:
  contents: read

# 同一分支或 PR 连续推送时取消尚未完成的运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3.0"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: poetry

      - name: Install dependencies
        run: poetry install

      - name: Ruff
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Mypy
        run: poetry run mypy

      - name: Pytest
        run: poetry run pytest

      - name: Alembic
        run: |
          poetry run alembic upgrade head
          poetry run alembic check

  image:
    name: Image build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: dicerobot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --detach --name dicerobot-ci \
            --env QQ__APP_ID=000000 \
            --env QQ__SECRET=ci-placeholder-secret \
            --publish 8080:8080 \
            dicerobot:ci

          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 1
          done

          echo "Smoke test failed"
          docker logs dicerobot-ci
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm --force dicerobot-ci || true
